name: rustup install workspace toolchain
description: Install the Rust toolchain for the workspace
branding:
  icon: activity
  color: purple

inputs:
  targets:
    description: Comma-separated list of target triples to install for this toolchain
    required: false
  components:
    description: Comma-separated list of components to be additionally installed
    required: false

runs:
  using: "composite"
  steps:
    - name: Extract Toolchain version from rust-toolchain.toml
      id: extract-toolchain-version
      shell: bash
      run: |
        channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' rust-toolchain.toml || echo)
        if [ -z "$channel" ]; then
          echo "WARNING: No toolchain version found in rust-toolchain.toml, using stable" >&2
          channel="stable"
        fi
        echo "result=${channel}" >> "$GITHUB_OUTPUT"
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ steps.extract-toolchain-version.outputs.result || 'stable' }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
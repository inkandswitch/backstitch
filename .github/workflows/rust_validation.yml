name: 🔍 Rust Validation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rustfmt:
    name: 📋 Format Check
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: 📎 Clippy
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Clippy (tokio-console)
        env:
            RUSTFLAGS: "--cfg tokio_unstable"
        run: cargo clippy --all-targets --features "tokio-console" -- -D warnings

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Run tests
        run: cargo test --all-targets --features ""
[package]
name = "backstitch_godot"
edition = "2024"
version.workspace = true
license = "MIT"
rust-version = "1.91.1"

[lib]
name = "backstitch_rust_godot"
crate-type = ["cdylib", "staticlib", "rlib"]
bench = false
doc = false

[features]
default = []
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
backstitch = { path = "../backstitch" }
godot = { version = "0.5.4", features = ["experimental-threads"] }
uuid = "1.5.0"

automerge = "0.9.0"
autosurgeon = { git = "https://github.com/LilithSilver/autosurgeon.git", branch = "upgrade-automerge" }
futures = "0.3.31"

samod = { git = "https://github.com/LilithSilver/samod.git", branch = "update-tungstenite-v10", features = [
    "tokio",
    "threadpool",
    "tungstenite",
] }

safer-ffi = "0.1.13"
regex = "1.12.2"
tokio = { version = "1.49.0", features = ["full"] }
console-subscriber = { version = "0.5.0", optional = true }
tracing = "0.1.40"

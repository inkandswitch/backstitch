[package]
name = "backstitch_rust"
version = "0.0.1"
authors = [
  "Orion Henry <orion.henry@gmail.com>",
  "Jason Kankiewicz <jason.kankiewicz@gmail.com>",
]
edition = "2024"
license = "MIT"
rust-version = "1.91.1"

[lib]
name = "backstitch_rust_core"
crate-type = ["cdylib", "staticlib", "rlib"]
bench = false
doc = false

[features]
default = []
tokio-console = ["dep:console-subscriber", "tokio/tracing"]

[dependencies]
automerge = "0.10.0"
autosurgeon = "0.12.0"
futures = "0.3.31"
godot = { version = "0.5.4", features = ["experimental-threads"] }
tokio = { version = "1.49.0", features = ["full"] }
console-subscriber = { version = "0.5.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tree-sitter = "0.26.11"
tree-sitter-godot-resource = { git = "https://github.com/nikitalita/tree-sitter-godot-resource.git", branch = "fix-string-names" }
safer-ffi = "0.1.13"
serde_json = "1.0.138"
uuid = "1.5.0"
similar = { version = "3.1.1", features = ["unicode"] }
notify = { version = "8.2.0", features = ["macos_fsevent"] }
notify-debouncer-full = { version = "0.7.0", features = ["macos_fsevent"] }
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
ignore = "0.4.22"
tracing = "0.1.40"
tracing-appender = "0.2.2"
chrono = { version = "0.4", features = ["unstable-locales"] }
samod = { version = "0.12.3", features = [
  "tokio",
  "threadpool",
  "tungstenite",
] }
rayon = "1.11.0"
regex = "1.12.2"
async-stream = "0.3.6"
tokio-stream = { version = "0.1.18", features = ["sync"] }
tokio-util = "0.7.18"
sys-locale = "0.3.2"
blake3 = { version = "1.8.4", features = ["serde"] }
wincode = { version = "0.6.0", features = ["derive"] }
fjall = "3.1.4"
jwalk = "0.8.1"
thiserror = "2.0.18"
tracing-panic = "0.1.2"
indexmap = "2.14"

[build-dependencies]
cbindgen = "^0.27"
static_vcruntime = "3.0"

[dev-dependencies]
tempfile = "3.0"
